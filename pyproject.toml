[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-digest-toolkit"
version = "1.0.1"
description = "Automated research aggregation TUI for software leadership and academic research"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["research", "tui", "textual", "aggregation", "hackernews", "arxiv"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Terminals",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "youtube-transcript-api>=0.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "diskcache>=5.6.0",
    "schedule>=1.1.0",
    "polars>=0.19.0",
    "scikit-learn>=1.3.0",
    "feedparser>=6.0.10",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "python-docx>=1.0.0",
    "markdownify>=0.11.0",
    "PyPDF2>=3.0.0",
    "arxiv>=2.1.0",
    "textual>=8.1.1",
    "typer>=0.9.0",
    "rich>=14.0.0",
    "tenacity>=8.0.0",
    "PyMuPDF>=1.23.0; sys_platform != 'linux'",
    "pyspellchecker>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.scripts]
Research_Toolkit = "research_digest_tui.cli:main"
rdt = "rdt.cli.main:app"

[project.urls]
Homepage = "https://github.com/DoubtfulPrism/research-digest-toolkit"
Repository = "https://github.com/DoubtfulPrism/research-digest-toolkit"
Issues = "https://github.com/DoubtfulPrism/research-digest-toolkit/issues"

[tool.hatch.build.targets.wheel]
# Named packages auto-include all their files (including .tcss stylesheets)
packages = ["research_digest_tui", "scrapers", "rdt"]
# Top-level runtime modules included for dev-fallback in RunnerService
include = [
    "config_models.py",
    "scheduler_utils.py",
    "rich_utils.py",
    "credentials.py",
    "database.py",
    "db_init.py",
    "retry_utils.py",
    "utils.py",
    "http_client.py",
    "analysis.py",
    "research_digest.py",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | research_digest
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "htmlcov",
    "research_digest",
    "venv",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests for workflows",
    "slow: Tests that take longer to run",
    "database: Tests that interact with database",
    "tui: Tests for TUI screens and widgets",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/tests/*",
    "setup.py",
    "venv/*",
    "*/venv/*",
    "__pycache__/*",
    "*/__pycache__/*",
    ".git/*",
    "research_digest/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "htmlcov",
    "research_digest",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py are OK
